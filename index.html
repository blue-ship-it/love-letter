<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6c9eb4" />
    <title>A letter for Hrishit</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="scene">
      <section class="letter" aria-label="A letter for Hrishit">
        <button class="corner-action" id="skip" type="button">skip</button>
        <button class="corner-action is-hidden" id="replay" type="button">replay</button>
        <article id="letter-text" aria-live="polite"></article>
        <span class="caret" id="caret" aria-hidden="true"></span>
      </section>
    </main>

    <section class="player-wrap" aria-label="Music player">
      <p id="player-hint">press play to begin</p>
      <div class="player">
        <button id="play" class="play" type="button" aria-label="Play music"><span></span></button>
        <div class="track-meta">
          <strong id="song-title">A song for us</strong>
          <small id="song-artist">Dishi &amp; Hrishit</small>
        </div>
        <div class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </section>
    <audio id="audio" preload="metadata"></audio>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
